<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Criativos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="viz-root">

  <header class="top">
    <div>
      <h1>Dashboard de Criativos</h1>
      <p id="subtitle"></p>
    </div>
    <div class="top-actions">
      <button class="btn" id="themeToggle" type="button">Modo escuro</button>
      <button class="btn" id="exportBtn" type="button">Exportar dados</button>
      <button class="btn primary" id="newClientBtn" type="button">+ Novo cliente</button>
    </div>
  </header>

  <div class="filters" id="filters"></div>

  <div class="today-banner" id="todayBanner"></div>

  <section class="stat-row" id="statRow"></section>

  <section>
    <div class="cal-card">
      <div class="cal-head">
        <div class="title" id="calTitle"></div>
        <div class="cal-note">Os dias marcados são os dias de postagem</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="sept-strip" id="septStrip"></div>
      <div class="legend" id="calLegend"></div>
    </div>
  </section>

  <section>
    <h2>Clientes</h2>
    <div class="client-grid" id="clientGrid"></div>
  </section>

  <footer id="footerNote"></footer>

  <div class="modal-overlay hidden" id="newClientModal">
    <div class="modal-box">
      <h3>Novo cliente</h3>
      <div class="field">
        <label for="ncNome">Nome do cliente</label>
        <input type="text" id="ncNome" placeholder="Ex.: Nome do Cliente">
      </div>
      <div class="field">
        <label>Datas de publicação</label>
        <div class="new-dates-row">
          <input type="date" id="ncDateInput">
          <button class="btn" id="ncAddDateBtn" type="button">Adicionar</button>
        </div>
        <div class="new-dates-list" id="ncDatesList"></div>
        <div class="field-hint">Cada data adicionada entra como "A produzir". A cota do cliente é o total de datas.</div>
      </div>
      <div class="field">
        <label>Cota do ciclo</label>
        <div id="ncCotaDisplay" style="font-size:13px;color:var(--text-secondary);">0 conteúdos (baseado nas datas acima)</div>
      </div>
      <div class="modal-msg" id="ncMsg"></div>
      <div class="modal-actions">
        <button class="btn" id="ncCancelBtn" type="button">Cancelar</button>
        <button class="btn primary" id="ncSaveBtn" type="button">Salvar cliente</button>
      </div>
    </div>
  </div>

</div>

<script src="js/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
